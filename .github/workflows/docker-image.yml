name: YogaSession Docker CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build ./backend --file ./backend/Dockerfile --tag yoga-backend:$(date +%s)

      - name: Build Frontend Docker Image
        run: docker build ./frontend --file ./frontend/Dockerfile --tag yoga-frontend:$(date +%s)
